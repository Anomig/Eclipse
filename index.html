<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#f4b14e"
  />

  <title>
    From Light to Lights — 12.08.2026
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>

<body>

  <!-- ==================================================
       SKY
  ================================================== -->

  <div class="sky">

    <div
      class="stars"
      id="stars"
    ></div>

    <canvas
      id="meteors"
    ></canvas>

    <div class="sun"></div>

    <div
      class="moon"
      id="moon"
    ></div>

  </div>


  <!-- ==================================================
       UI
  ================================================== -->

  <main class="ui">

    <header class="top">

      <div class="title">
        FROM LIGHT TO LIGHT
      </div>

      <div class="location">
        12.08.2026<br>
        BELGIUM
      </div>

    </header>


    <!-- ==================================================
         INFORMATION
    ================================================== -->

    <section class="info">

      <div
        class="percentage"
        id="percentage"
      >
        0.0%
      </div>

      <div
        class="label"
        id="label"
      >
        the eclipse begins
      </div>

    </section>


    <!-- ==================================================
         INTERACTION HINT
    ================================================== -->

    <div class="hint">
      drag the moon
    </div>


    <!-- ==================================================
         TIMELINE
    ================================================== -->

    <footer class="bottom">

      <div class="timeline">

        <div
          class="timeline-progress"
          id="progress"
        ></div>

      </div>

      <div class="times">

        <span>19:18</span>

        <span id="event">
          ECLIPSE
        </span>

        <span>21:05</span>

      </div>

    </footer>

  </main>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->

  <script src="script.js"></script>

</body>
</html>
